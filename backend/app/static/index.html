<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tomato Case Agent</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8f5;
        --panel: #ffffff;
        --ink: #18221b;
        --muted: #667064;
        --line: #dfe5dc;
        --green: #2f7d4a;
        --amber: #b7791f;
        --red: #b42318;
        --blue: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) 380px;
        gap: 18px;
        max-width: 1180px;
        margin: 0 auto;
        padding: 22px;
      }

      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 720;
        letter-spacing: 0;
      }

      .status-strip {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 13px;
      }

      .pill {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 999px;
        padding: 5px 10px;
      }

      .surface {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        min-width: 0;
      }

      .chat {
        display: grid;
        grid-template-rows: 1fr auto;
        height: calc(100vh - 116px);
        min-height: 520px;
      }

      .messages {
        overflow: auto;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        max-width: 78%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 11px 12px;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .message.user {
        align-self: flex-end;
        background: #eef6ef;
        border-color: #c9ddcf;
      }

      .message.agent {
        align-self: flex-start;
        background: #fff;
      }

      .composer {
        border-top: 1px solid var(--line);
        padding: 12px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      textarea {
        width: 100%;
        min-height: 58px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 11px;
        font: inherit;
        line-height: 1.4;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 0 18px;
        min-width: 88px;
        font: inherit;
        font-weight: 650;
        color: #fff;
        background: var(--green);
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      aside {
        height: calc(100vh - 116px);
        min-height: 520px;
        overflow: auto;
        padding: 16px;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 15px;
      }

      .section {
        border-top: 1px solid var(--line);
        padding-top: 14px;
        margin-top: 14px;
      }

      dl {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 8px 12px;
        margin: 0;
        font-size: 14px;
      }

      dt {
        color: var(--muted);
      }

      dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      ul {
        margin: 8px 0 0;
        padding-left: 18px;
      }

      li {
        margin: 5px 0;
      }

      .empty {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .tone-red {
        color: var(--red);
      }

      .tone-amber {
        color: var(--amber);
      }

      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
          padding: 14px;
        }

        .chat,
        aside {
          height: auto;
          min-height: 420px;
        }

        .message {
          max-width: 92%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Tomato Case Agent</h1>
        <div class="status-strip">
          <span class="pill" id="casePill">未创建病例</span>
          <span class="pill">Conversation → Case</span>
        </div>
      </header>

      <section class="surface chat" aria-label="conversation">
        <div class="messages" id="messages">
          <div class="message agent">你可以直接描述番茄的问题，例如：下部老叶有褐色斑点，一圈一圈的，最近连续阴雨，现在结果期，距离采收大概 10 天。</div>
        </div>
        <form class="composer" id="composer">
          <textarea id="messageInput" placeholder="描述症状、补充信息或提交复查..." required></textarea>
          <button id="sendButton" type="submit">发送</button>
        </form>
      </section>

      <aside class="surface">
        <h2>当前病例</h2>
        <dl>
          <dt>Case ID</dt>
          <dd id="caseId">-</dd>
          <dt>状态</dt>
          <dd id="caseStatus">-</dd>
          <dt>响应类型</dt>
          <dd id="responseType">-</dd>
          <dt>疑似问题</dt>
          <dd id="diagnosis">-</dd>
          <dt>复查日期</dt>
          <dd id="followupDate">-</dd>
        </dl>

        <div class="section">
          <h2>处置方案</h2>
          <div id="plan" class="empty">尚未生成处置方案。</div>
        </div>

        <div class="section">
          <h2>安全提醒</h2>
          <div id="safety" class="empty">尚无安全提醒。</div>
        </div>
      </aside>
    </main>

    <script>
      let currentCaseId = null;
      const userId = "default";

      const $ = (id) => document.getElementById(id);

      function appendMessage(role, text) {
        const node = document.createElement("div");
        node.className = `message ${role}`;
        node.textContent = text;
        $("messages").appendChild(node);
        $("messages").scrollTop = $("messages").scrollHeight;
      }

      function list(items) {
        if (!items || items.length === 0) return "-";
        return `<ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function renderResponse(payload) {
        const response = payload.response;
        currentCaseId = payload.case_id;
        $("casePill").textContent = `Case #${currentCaseId}`;
        $("caseId").textContent = currentCaseId;
        $("caseStatus").textContent = response.status;
        $("responseType").textContent = response.response_type;
        $("diagnosis").textContent = response.diagnosis
          ? `${response.diagnosis.suspected_problem || "-"} / ${response.diagnosis.likelihood || "-"}`
          : "-";
        $("followupDate").textContent = response.followup ? response.followup.due_date : "-";

        if (response.plan) {
          $("plan").className = "";
          $("plan").innerHTML = `
            <div>${escapeHtml(response.plan.summary)}</div>
            ${list(response.plan.immediate_actions)}
          `;
        }

        if (response.safety && response.safety.warnings.length) {
          $("safety").className = response.safety.risk_level === "high" ? "tone-red" : "tone-amber";
          $("safety").innerHTML = list(response.safety.warnings);
        }

        let text = response.message;
        if (response.decision && response.decision.questions.length) {
          text += "\n\n" + response.decision.questions.map((q, i) => `${i + 1}. ${q}`).join("\n");
        }
        if (response.diagnosis) {
          text += `\n\n疑似问题：${response.diagnosis.suspected_problem || "-"}（${response.diagnosis.likelihood || "-"}）`;
        }
        if (response.followup) {
          text += `\n复查日期：${response.followup.due_date}`;
        }
        appendMessage("agent", text);
      }

      $("composer").addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = $("messageInput").value.trim();
        if (!text) return;

        appendMessage("user", text);
        $("messageInput").value = "";
        $("sendButton").disabled = true;

        try {
          const result = await fetch("/api/conversation/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              user_id: userId,
              case_id: currentCaseId,
              message: text,
            }),
          });
          if (!result.ok) throw new Error(await result.text());
          renderResponse(await result.json());
        } catch (error) {
          appendMessage("agent", `请求失败：${error.message}`);
        } finally {
          $("sendButton").disabled = false;
          $("messageInput").focus();
        }
      });
    </script>
  </body>
</html>
