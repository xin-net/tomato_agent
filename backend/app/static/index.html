<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tomato Case Agent</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8f5;
        --panel: #ffffff;
        --ink: #18221b;
        --muted: #667064;
        --line: #dfe5dc;
        --green: #2f7d4a;
        --amber: #b7791f;
        --red: #b42318;
        --blue: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) 380px;
        gap: 18px;
        max-width: 1180px;
        margin: 0 auto;
        padding: 22px;
      }

      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 720;
        letter-spacing: 0;
      }

      .status-strip {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 13px;
      }

      .pill {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 999px;
        padding: 5px 10px;
      }

      .debug-button {
        min-width: auto;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 13px;
        font-weight: 600;
      }

      .surface {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        min-width: 0;
      }

      .chat {
        display: grid;
        grid-template-rows: 1fr auto;
        height: calc(100vh - 116px);
        min-height: 520px;
      }

      .messages {
        overflow: auto;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        max-width: 78%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 11px 12px;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .message.user {
        align-self: flex-end;
        background: #eef6ef;
        border-color: #c9ddcf;
      }

      .message.agent {
        align-self: flex-start;
        background: #fff;
      }

      .composer {
        border-top: 1px solid var(--line);
        padding: 12px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      textarea {
        width: 100%;
        min-height: 58px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 11px;
        font: inherit;
        line-height: 1.4;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 0 18px;
        min-width: 88px;
        font: inherit;
        font-weight: 650;
        color: #fff;
        background: var(--green);
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      aside {
        height: calc(100vh - 116px);
        min-height: 520px;
        overflow: auto;
        padding: 16px;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 15px;
      }

      .section {
        border-top: 1px solid var(--line);
        padding-top: 14px;
        margin-top: 14px;
      }

      dl {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 8px 12px;
        margin: 0;
        font-size: 14px;
      }

      dt {
        color: var(--muted);
      }

      dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      ul {
        margin: 8px 0 0;
        padding-left: 18px;
      }

      li {
        margin: 5px 0;
      }

      .empty {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .tone-red {
        color: var(--red);
      }

      .tone-amber {
        color: var(--amber);
      }

      .state-machine {
        display: grid;
        gap: 10px;
      }

      .state-stage {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .state-stage.single {
        grid-template-columns: minmax(0, 1fr);
      }

      .state-node {
        min-height: 74px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: #fff;
      }

      .state-code {
        font-size: 11px;
        font-weight: 760;
        line-height: 1.1;
        overflow-wrap: anywhere;
      }

      .state-label {
        color: var(--muted);
        font-size: 12px;
      }

      .state-next {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .state-chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1;
        padding: 3px 5px;
      }

      .state-node.active {
        border-color: var(--green);
        background: #edf8f0;
        box-shadow: inset 0 0 0 1px var(--green);
      }

      .state-node.next {
        border-color: #9fb8a7;
        background: #f8fcf9;
      }

      .state-chip.active-next {
        border-color: var(--green);
        color: var(--green);
        background: #edf8f0;
      }

      .state-node.reserved {
        background: #fafafa;
      }

      .state-node.warning {
        border-color: #f0c36a;
      }

      .state-node.danger {
        border-color: #f1a39d;
      }

      .state-node.done {
        border-color: #b8c7df;
      }

      .state-arrow {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        line-height: 1;
      }

      .state-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }

      .legend-dot {
        width: 9px;
        height: 9px;
        display: inline-block;
        border-radius: 999px;
        margin-right: 4px;
        border: 1px solid var(--line);
      }

      .legend-dot.active {
        background: #edf8f0;
        border-color: var(--green);
      }

      .legend-dot.pending {
        background: #fff;
      }

      .legend-dot.next {
        background: #f8fcf9;
        border-color: #9fb8a7;
      }

      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
          padding: 14px;
        }

        .chat,
        aside {
          height: auto;
          min-height: 420px;
        }

        .message {
          max-width: 92%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Tomato Case Agent</h1>
        <div class="status-strip">
          <span class="pill" id="casePill">未创建病例</span>
          <span class="pill">Conversation → Case</span>
          <button class="debug-button" id="newSessionButton" type="button">新会话</button>
        </div>
      </header>

      <section class="surface chat" aria-label="conversation">
        <div class="messages" id="messages">
          <div class="message agent">你可以直接描述番茄的问题，例如：下部老叶有褐色斑点，一圈一圈的，最近连续阴雨，现在结果期，距离采收大概 10 天。</div>
        </div>
        <form class="composer" id="composer">
          <textarea id="messageInput" placeholder="描述症状、补充信息或提交复查..." required></textarea>
          <button id="sendButton" type="submit">发送</button>
        </form>
      </section>

      <aside class="surface">
        <h2>当前病例</h2>
        <dl>
          <dt>Case ID</dt>
          <dd id="caseId">-</dd>
          <dt>状态</dt>
          <dd id="caseStatus">-</dd>
          <dt>响应类型</dt>
          <dd id="responseType">-</dd>
          <dt>疑似问题</dt>
          <dd id="diagnosis">-</dd>
          <dt>复查日期</dt>
          <dd id="followupDate">-</dd>
        </dl>

        <div class="section">
          <h2>处置方案</h2>
          <div id="plan" class="empty">尚未生成处置方案。</div>
        </div>

        <div class="section">
          <h2>状态机观察</h2>
          <div class="state-machine" id="stateMachine" aria-label="case state machine"></div>
          <div class="state-legend">
            <span><span class="legend-dot active"></span>当前状态</span>
            <span><span class="legend-dot next"></span>可达下一状态</span>
            <span><span class="legend-dot pending"></span>其他状态</span>
          </div>
        </div>

        <div class="section">
          <h2>安全提醒</h2>
          <div id="safety" class="empty">尚无安全提醒。</div>
        </div>
      </aside>
    </main>

    <script>
      let currentCaseId = null;
      let userId = getOrCreateDebugUserId();
      const stateStages = [
        [{ code: "NEW", label: "新病例" }],
        [
          { code: "NEED_MORE_INFO", label: "待补充" },
          { code: "DIAGNOSED", label: "已诊断", reserved: true },
        ],
        [{ code: "FOLLOWUP_PENDING", label: "待复查" }],
        [{ code: "FOLLOWUP_REVIEW", label: "复查判断" }],
        [
          { code: "IMPROVING", label: "好转", tone: "warning" },
          { code: "WORSENING", label: "恶化", tone: "danger" },
          { code: "ESCALATED", label: "人工确认", tone: "danger" },
        ],
        [{ code: "CLOSED", label: "已结案", tone: "done" }],
      ];
      const transitions = {
        NEW: ["NEED_MORE_INFO", "FOLLOWUP_PENDING", "ESCALATED"],
        NEED_MORE_INFO: ["NEED_MORE_INFO", "FOLLOWUP_PENDING", "ESCALATED"],
        DIAGNOSED: ["FOLLOWUP_PENDING", "ESCALATED"],
        FOLLOWUP_PENDING: ["FOLLOWUP_REVIEW", "ESCALATED"],
        FOLLOWUP_REVIEW: ["IMPROVING", "WORSENING", "ESCALATED", "NEED_MORE_INFO", "CLOSED"],
        IMPROVING: ["FOLLOWUP_PENDING", "CLOSED", "ESCALATED"],
        WORSENING: ["ESCALATED", "FOLLOWUP_PENDING"],
        ESCALATED: ["CLOSED"],
        CLOSED: [],
      };

      const $ = (id) => document.getElementById(id);

      function getOrCreateDebugUserId() {
        const storageKey = "tomatoAgentDebugUserId";
        let value = sessionStorage.getItem(storageKey);
        if (!value) {
          value = `debug-${crypto.randomUUID()}`;
          sessionStorage.setItem(storageKey, value);
        }
        return value;
      }

      function resetDebugSession() {
        sessionStorage.removeItem("tomatoAgentDebugUserId");
        userId = getOrCreateDebugUserId();
        currentCaseId = null;
        $("casePill").textContent = "未创建病例";
        $("caseId").textContent = "-";
        $("caseStatus").textContent = "-";
        $("responseType").textContent = "-";
        $("diagnosis").textContent = "-";
        $("followupDate").textContent = "-";
        $("plan").className = "empty";
        $("plan").textContent = "尚未生成处置方案。";
        $("safety").className = "empty";
        $("safety").textContent = "尚无安全提醒。";
        renderStateMachine();
      }

      function renderStateMachine(activeStatus = "") {
        const nextStates = new Set(transitions[activeStatus] || []);
        $("stateMachine").innerHTML = stateStages
          .map((stage, stageIndex) => {
            const nodes = stage
              .map((state) => {
                const classes = ["state-node"];
                if (state.code === activeStatus) classes.push("active");
                if (nextStates.has(state.code)) classes.push("next");
                if (state.reserved) classes.push("reserved");
                if (state.tone) classes.push(state.tone);
                const next = transitions[state.code] || [];
                return `
                  <div class="${classes.join(" ")}" data-state="${state.code}">
                    <div class="state-code">${state.code}</div>
                    <div class="state-label">${state.label}</div>
                    <div class="state-next">
                      ${next
                        .map((target) => {
                          const chipClass = target === activeStatus ? "state-chip active-next" : "state-chip";
                          return `<span class="${chipClass}">${target}</span>`;
                        })
                        .join("")}
                    </div>
                  </div>
                `;
              })
              .join("");
            const rowClass = stage.length === 1 ? "state-stage single" : "state-stage";
            const arrow = stageIndex < stateStages.length - 1 ? '<div class="state-arrow">↓</div>' : "";
            return `<div class="${rowClass}">${nodes}</div>${arrow}`;
          })
          .join("");
      }

      function appendMessage(role, text) {
        const node = document.createElement("div");
        node.className = `message ${role}`;
        node.textContent = text;
        $("messages").appendChild(node);
        $("messages").scrollTop = $("messages").scrollHeight;
      }

      function list(items) {
        if (!items || items.length === 0) return "-";
        return `<ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function renderResponse(payload) {
        const response = payload.response;
        currentCaseId = payload.case_id;
        $("casePill").textContent = "当前病例";
        $("caseId").textContent = currentCaseId;
        $("caseStatus").textContent = response.status;
        renderStateMachine(response.status);
        $("responseType").textContent = response.response_type;
        $("diagnosis").textContent = response.diagnosis
          ? `${response.diagnosis.suspected_problem || "-"} / ${response.diagnosis.likelihood || "-"}`
          : "-";
        $("followupDate").textContent = response.followup ? response.followup.due_date : "-";

        if (response.plan) {
          $("plan").className = "";
          $("plan").innerHTML = `
            <div>${escapeHtml(response.plan.summary)}</div>
            ${list(response.plan.immediate_actions)}
          `;
        }

        if (response.safety && response.safety.warnings.length) {
          $("safety").className = response.safety.risk_level === "high" ? "tone-red" : "tone-amber";
          $("safety").innerHTML = list(response.safety.warnings);
        }

        let text = response.message;
        if (response.decision && response.decision.questions.length) {
          text += "\n\n" + response.decision.questions.map((q, i) => `${i + 1}. ${q}`).join("\n");
        }
        if (response.diagnosis) {
          text += `\n\n疑似问题：${response.diagnosis.suspected_problem || "-"}（${response.diagnosis.likelihood || "-"}）`;
        }
        if (response.followup) {
          text += `\n复查日期：${response.followup.due_date}`;
        }
        appendMessage("agent", text);
      }

      $("composer").addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = $("messageInput").value.trim();
        if (!text) return;

        appendMessage("user", text);
        $("messageInput").value = "";
        $("sendButton").disabled = true;

        try {
          const result = await fetch("/api/conversation/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              user_id: userId,
              case_id: currentCaseId,
              message: text,
            }),
          });
          if (!result.ok) throw new Error(await result.text());
          renderResponse(await result.json());
        } catch (error) {
          appendMessage("agent", `请求失败：${error.message}`);
        } finally {
          $("sendButton").disabled = false;
          $("messageInput").focus();
        }
      });

      $("newSessionButton").addEventListener("click", resetDebugSession);

      renderStateMachine();
    </script>
  </body>
</html>
